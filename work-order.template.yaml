# Canonical Agent Conductor work order template.
# Save a copy as something like:
#   001-add-health-endpoint.yaml
#
# This template is the forward-looking reference shape:
# - schema_version: 2
# - explicit requirements
# - typed acceptance criteria with explicit verification metadata
#
# Valid types:
# - new_feature
# - bug_fix
# - refactor
# - schema_change
# - docs
# - bootstrap
#
# Notes:
# - Use the canonical field order below.
# - Keep work orders narrow. Prefer 1-3 files changed when practical.
# - Every acceptance criterion needs an id, requirement_ids, required flag, and verification block.
# - `verification.check` values must match verify.commands in project.yaml.
# - `verification.route` values must match verify.smoke in project.yaml.
# - For bootstrap work orders, keep the same schema_version: 2 shape; known_files can list the initial files bootstrap is expected to create.
# - `audit_source` is optional and normally only set by the planner audit pass.

schema_version: 2
title: "Add health check endpoint"
type: new_feature
target_module: internal/health
reference_module: internal/status
known_files:
  - cmd/server/main.go
  - internal/routes/router.go
  - internal/status/handler.go
requirements:
  - id: REQ-1
    text: "The service exposes a GET /health endpoint with the expected JSON response"
  - id: REQ-2
    text: "The change preserves existing routing and status-handler behavior"
acceptance_criteria:
  - id: AC-1
    description: "The health handler and route are implemented in the expected modules"
    requirement_ids: ["REQ-1"]
    required: true
    verification:
      kind: diff_review
      focus:
        - "internal/health"
        - "internal/routes/router.go"
  - id: AC-2
    description: "GET /health returns 200 with a JSON response"
    requirement_ids: ["REQ-1"]
    required: true
    verification:
      kind: http_smoke
      route: health
      method: GET
      path: /health
      expect_status: 200
      expect_content_type: "application/json"
  - id: AC-3
    description: "The project still builds after the health endpoint is added"
    requirement_ids: ["REQ-1"]
    required: true
    verification:
      kind: precheck
      check: build
  - id: AC-4
    description: "Existing status handler behavior remains compatible with the new route wiring"
    requirement_ids: ["REQ-2"]
    required: false
    verification:
      kind: file_compatibility
      subject: "internal/status/handler.go"
      expectation: "Existing status handler behavior remains unchanged"
constraints:
  - "Do not change unrelated routes or middleware behavior"
  - "Do not add new external dependencies"
  - "Follow existing handler and response patterns from internal/status"
# audit_source: modified
