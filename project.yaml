project:
  name: agent-conductor
  path: /home/gernsback/source/agent-conductor
  language: go

index:
  include:
    - "**/*.go"
    - "**/*.md"
  exclude:
    - "**/vendor/**"
    - "**/.git/**"
    - "**/bin/**"
    - "**/.conductor/**"

executor:
  tool: claude-code
  timeout_minutes: 30

prompts:
  scope: templates/scope-prompt.md
  verify: templates/verify-prompt.md
  build: templates/build-prompt.md

safety:
  max_files_changed: 50
  max_duration_mins: 60
