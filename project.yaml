project:
  name: agent-conductor
  path: /home/gernsback/source/agent-conductor
  language: go
  data_dir: /home/gernsback/LLM/.conductor/agent-conductor

index:
  include:
    - "**/*.go"
    - "**/*.md"
  exclude:
    - "**/vendor/**"
    - "**/.git/**"
    - "**/bin/**"
    - "**/.conductor/**"

local_model:
  endpoint: "http://localhost:8080/v1"
  model_name: ""
  temperature: 0.0
  timeout_seconds: 60

embed_model:
  endpoint: "http://localhost:8081/v1"
  model_name: "nomic-embed-text-v1.5"
  timeout_seconds: 30

executor:
  tool: claude-code
  timeout_minutes: 30

prompts:
  scope: templates/scope-prompt.md
  verify: templates/verify-prompt.md
  build: templates/build-prompt.md

safety:
  max_files_changed: 50
  max_duration_mins: 60
