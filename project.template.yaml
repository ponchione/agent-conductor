# Canonical Agent Conductor project template.
# Copy this file into another repo as project.yaml and then replace the example values.
#
# This template is the forward-looking reference shape:
# - project-local repository settings only
# - no machine-level model/provider/git defaults
# - typed verify commands and smoke routines that work orders can reference
#
# Notes:
# - project.path should be an absolute path to the target repository.
# - DataDir is computed automatically; there is no YAML key for it.
# - Add a prompts section only when this repo needs prompt overrides.
# - Machine-wide model routing, embedding endpoints, git defaults, and executor defaults belong in global config.

project:
  name: your-project-name
  path: /absolute/path/to/your-project
  language: go
  framework: ""

index:
  include:
    - "**/*.go"
    - "**/*.sql"
    - "**/*.md"
  exclude:
    - "**/.git/**"
    - "**/vendor/**"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/.conductor/**"
  max_rag_results: 30
  max_tree_lines: 200
  auto_reindex: true
  max_file_size_bytes: 51200
  max_total_file_size_bytes: 524288

conventions:
  module_path: "github.com/your-org/your-project"
  module_structure:
    - "orchestrator.go"
    - "types.go"
    - "service.go"
  shared_path: "internal/shared/"
  sql_path: "sql/"
  docs_path: "docs/"

# Optional prompt overrides. Omit this entire section if the repo uses built-in defaults.
# Hierarchical planning uses separate prompts for epic decomposition, task decomposition,
# and the final audit pass.
# prompts:
#   build: ""
#   plan_epic: ""
#   plan_task: ""
#   plan_audit: ""
#   scope_decompose: ""
#   scope_analyze: ""
#   scope_crosscut: ""
#   scope_synthesize: ""
#   verify_analyze: ""
#   verify_synthesize: ""
#   describe: ""
#   bootstrap: ""

verify:
  # Work-order `verification.check` values must match keys in verify.commands.
  commands:
    build:
      argv: ["make", "build"]
      workdir: "."
      timeout_seconds: 120
    test:
      argv: ["make", "test"]
      workdir: "."
      timeout_seconds: 300

  # Work-order `verification.route` values must match keys in verify.smoke.
  smoke:
    health:
      command:
        argv: ["make", "smoke-health"]
        workdir: "."
        timeout_seconds: 180

safety:
  forbidden_paths:
    - ".github/workflows/"
    - "infra/terraform/"
  max_files_changed: 50
  max_duration_mins: 60

guardrails:
  max_investigation_targets: 6
  max_sub_calls_total: 12
  phase_timeout_seconds: 300
  max_cost_per_phase_usd: 0.50
  warn_cost_per_phase_usd: 0.10
